name: Playwright Tests
on:
    deployment_status:
permissions:
    contents: read
jobs:
    test:
        name: End-to-end and accessibility
        timeout-minutes: 60
        if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
        runs-on: ubuntu-latest
        steps:
            - name: Validate Vercel bypass secret
              env:
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: |
                  if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
                    echo "::error title=Missing Vercel bypass secret::Add VERCEL_AUTOMATION_BYPASS_SECRET as a GitHub Actions repository secret."
                    exit 1
                  fi
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.deployment.sha }}
            - name: Install repository toolchain
              uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(mise exec -- pnpm store path)" >> $GITHUB_OUTPUT
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Install Dependencies
              run: mise exec -- pnpm install --frozen-lockfile && mise exec -- pnpm exec playwright install --with-deps chromium
            - name: Validate
              run: mise exec -- pnpm validate
            - name: Unit and component accessibility tests
              run: mise exec -- pnpm test --runInBand
            - name: Run e2e script
              run: mise exec -- pnpm test:e2e
              env:
                  CI: true
                  E2E_MODE: preview
                  E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
                  PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 30
